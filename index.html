// 更新已选文本显示
function updateCategorySelectedText() {
    const textEl = document.getElementById('categorySelectedText');
    if (selectedCategories.includes('all')) {
        textEl.textContent = '全部险种';
    } else if (selectedCategories.length === 0) {
        textEl.textContent = '请选择险种';
    } else if (selectedCategories.length === 1) {
        textEl.textContent = selectedCategories[0];
    } else {
        textEl.textContent = `已选 ${selectedCategories.length} 个险种`;
    }
}

// 切换"全部"选项
function toggleAllCategories() {
    const allCheckbox = document.getElementById('categoryAll');
    allCheckbox.checked = true;
    
    // 选中全部，其他全部取消
    selectedCategories = ['all'];
    document.querySelectorAll('.category-option-checkbox').forEach(cb => {
        cb.checked = false;
    });
    
    updateCategorySelectedText();
    updateChart();
    updateTable();
    updateInstitutionTable();
    updateStatsCards();
}

// 切换单个险种选择
function toggleCategory(category, checkbox) {
    if (typeof event !== 'undefined') event.stopPropagation();
    
    const allCheckbox = document.getElementById('categoryAll');
    
    if (checkbox.checked) {
        // 选中具体险种，取消"全部"
        allCheckbox.checked = false;
        selectedCategories = selectedCategories.filter(c => c !== 'all');
        
        if (!selectedCategories.includes(category)) {
            selectedCategories.push(category);
        }
    } else {
        // 取消选中该险种
        selectedCategories = selectedCategories.filter(c => c !== category);
        
        // 如果没有选中任何具体险种，自动回到"全部"
        if (selectedCategories.length === 0) {
            selectedCategories = ['all'];
            allCheckbox.checked = true;
            // 取消所有具体险种的勾选
            document.querySelectorAll('.category-option-checkbox').forEach(cb => {
                cb.checked = false;
            });
        }
    }
    
    updateCategorySelectedText();
    updateChart();
    updateTable();
    updateInstitutionTable();
    updateStatsCards();
}

// ============================================
// 密码验证功能
// ============================================

// 从数据中获取最新日期作为密码
function getPasswordFromData() {
    // 从内嵌数据中获取所有日期
    const allDates = [];
    if (EMBEDDED_DATA && EMBEDDED_DATA.metadata) {
        if (EMBEDDED_DATA.metadata.dates_2025) {
            allDates.push(...EMBEDDED_DATA.metadata.dates_2025);
        }
        if (EMBEDDED_DATA.metadata.dates_2026) {
            allDates.push(...EMBEDDED_DATA.metadata.dates_2026);
        }
    }
    
    if (allDates.length === 0) {
        return '20260304'; // 默认密码
    }
    
    // 排序获取最新日期
    allDates.sort();
    const latestDate = allDates[allDates.length - 1]; // 格式: 2026-03-04
    
    // 转换为密码格式: 20260304
    return latestDate.replace(/-/g, '');
}

// 从数据中获取最新日期用于显示（格式: 2026/3/4）
function getDataDisplayDate() {
    // 从内嵌数据中获取所有日期
    const allDates = [];
    if (EMBEDDED_DATA && EMBEDDED_DATA.metadata) {
        if (EMBEDDED_DATA.metadata.dates_2025) {
            allDates.push(...EMBEDDED_DATA.metadata.dates_2025);
        }
        if (EMBEDDED_DATA.metadata.dates_2026) {
            allDates.push(...EMBEDDED_DATA.metadata.dates_2026);
        }
    }
    
    if (allDates.length === 0) {
        return '';
    }
    
    // 排序获取最新日期
    allDates.sort();
    const latestDate = allDates[allDates.length - 1]; // 格式: 2026-03-04
    
    // 转换为显示格式: 2026/3/4
    const parts = latestDate.split('-');
    return `（数据时间：${parts[0]}/${parseInt(parts[1])}/${parseInt(parts[2])}）`;
}

// 格式化保费显示（转换为万元）
function formatPremium(premium) {
    if (!premium || premium === 0) return '-';
    const val = parseFloat(premium) / 10000;
    return val.toFixed(2) + '万';
}

});

// 显示主内容
function showMainContent() {
    document.getElementById('passwordMask').style.display = 'none';
    document.getElementById('mainContent').style.display = 'block';
}

// 验证密码
function checkPassword() {
    const input = document.getElementById('passwordInput').value.trim();
    const correctPassword = getPasswordFromData();
    
    if (input === correctPassword) {
        sessionStorage.setItem('authenticated', 'true');
        showMainContent();
        loadData();
    } else {
        document.getElementById('passwordError').style.display = 'block';
        document.getElementById('passwordInput').value = '';
        document.getElementById('passwordInput').focus();
    }
}

// 回车键提交
function handlePasswordKeypress(event) {
    if (event.key === 'Enter') {
        checkPassword();
    }
}

// ============================================
// 初始化
// ============================================
document.addEventListener('DOMContentLoaded', function() {
    // 绑定回车键事件
    const passwordInput = document.getElementById('passwordInput');
    if (passwordInput) {
        passwordInput.addEventListener('keypress', handlePasswordKeypress);
    }
    
    // 检查是否已验证过密码（使用sessionStorage，关闭页面后失效）
    if (sessionStorage.getItem('authenticated') === 'true') {
        showMainContent();
        loadData();
    }
    // 否则显示密码输入界面，等待用户输入
});

// ============================================
// 加载数据 - 优先从data.json加载，失败则使用内嵌数据
// ============================================
async function loadData() {
    try {
        let result;
        try {
            // 尝试从data.json加载
            const response = await fetch('data.json');
            if (response.ok) {
                result = await response.json();
                console.log('从data.json加载数据成功');
            } else {
                throw new Error('Fetch failed');
            }
        } catch (e) {
            // 失败则使用内嵌数据
            console.log('使用内嵌数据');
            result = EMBEDDED_DATA;
        }

        allCategories = result.metadata.categories;
        allInstitutions = result.metadata.institutions;
        timeSeriesData = result.time_series;
        detailData = result.detail_data;

        updateSelectOptions();
        updateStatsCards();
        updateChart();
        createInstitutionStackChart(); // 创建各机构堆积柱状图（不与筛选联动）
        updateInstitutionTable();
        updateTable();

        document.getElementById('successBanner').style.display = 'block';
        setTimeout(() => {
            document.getElementById('successBanner').style.display = 'none';
        }, 3000);
        
    } catch (error) {
        console.error('加载数据失败:', error);
        document.getElementById('tableContainer').innerHTML = `
            <div class="error">
                <strong>加载失败：</strong>${error.message}<br><br>
                请先运行 <code>python convert_excel_to_json.py</code> 生成数据
            </div>
        `;
    }
}

// ============================================
// 更新下拉框选项
// ============================================
function updateSelectOptions() {
    const institutionSelect = document.getElementById('institutionSelect');
    const currentInstitution = institutionSelect.value;

    // 更新机构下拉框
    institutionSelect.innerHTML = '<option value="all">全部机构</option>';
    allInstitutions.forEach(inst => {
        const option = document.createElement('option');
        option.value = inst;
        option.textContent = inst;
        institutionSelect.appendChild(option);
    });
    institutionSelect.value = currentInstitution;
    
    // 更新险种多选框
    const categoryOptions = document.getElementById('categoryOptions');
    categoryOptions.innerHTML = '';
    allCategories.forEach(cat => {
        const div = document.createElement('div');
        div.className = 'multi-select-option';
        div.onclick = function(e) { 
            if (e.target.tagName !== 'INPUT') {
                const cb = this.querySelector('input');
                cb.checked = !cb.checked;
                toggleCategory(cat, cb);
            }
        };
        
        const isChecked = selectedCategories.includes('all') || selectedCategories.includes(cat);
        
        div.innerHTML = `
            <input type="checkbox" class="category-option-checkbox" 
                   value="${cat}" ${isChecked ? 'checked' : ''} 
                   onchange="toggleCategory('${cat}', this)">
            <label>${cat}</label>
        `;
        categoryOptions.appendChild(div);
    });
}

// ============================================
// 计算筛选后的保费（按日期）- 返回万元单位
// ============================================
function calculateFilteredPremium(year, date) {
    const institutionFilter = document.getElementById('institutionSelect').value;
    
    const dateData = detailData[year][date];
    if (!dateData || !dateData.records) return 0;
    
    const totalYuan = dateData.records
        .filter(r => {
            // 险种筛选：如果选了'all'，或者选中的数组包含该险种
            if (selectedCategories.includes('all')) return true;
            return selectedCategories.includes(r.category);
        })
        .filter(r => institutionFilter === 'all' || r.institution === institutionFilter)
        .reduce((sum, r) => sum + (parseFloat(r.premium) || 0), 0);
    
    // 转换为万元，保留两位小数
    return Math.round(totalYuan / 10000 * 100) / 100;
}

// ============================================
// 更新统计卡片 - 显示最新日期的累计值（不要累加不同日期）
// ============================================
function updateStatsCards() {
    // 获取最新日期
    const dates2025 = Object.keys(detailData[2025]).sort();
    const dates2026 = Object.keys(detailData[2026]).sort();
    
    const latestDate2025 = dates2025[dates2025.length - 1];
    const latestDate2026 = dates2026[dates2026.length - 1];
    
    // 获取最新日期的累计保费（不要累加不同日期）
    const total2025 = latestDate2025 ? calculateFilteredPremium(2025, latestDate2025) : 0;
    const total2026 = latestDate2026 ? calculateFilteredPremium(2026, latestDate2026) : 0;
    
    // 计算增长率
    const growthRate = total2025 > 0 ? ((total2026 - total2025) / total2025 * 100) : 0;
    const growthSign = growthRate >= 0 ? '+' : '';
    const growthColor = growthRate >= 0 ? '#28a745' : '#dc3545';
    
    // 更新显示（万元单位）
    document.getElementById('total2025').innerHTML = formatNumber(total2025) + '<small style="font-size:14px;margin-left:4px;">万元</small>';
    document.getElementById('count2025').textContent = '最新: ' + (latestDate2025 || '-');
    
    document.getElementById('total2026').innerHTML = formatNumber(total2026) + '<small style="font-size:14px;margin-left:4px;">万元</small>';
    document.getElementById('count2026').textContent = '最新: ' + (latestDate2026 || '-');
    
    const growthEl = document.getElementById('growthRate');
    growthEl.textContent = growthSign + (parseFloat(growthRate) || 0).toFixed(2) + '%';
    growthEl.style.color = growthRate >= 0 ? '#28a745' : '#dc3545';
    
    // 统计同比正增/负增机构数（排除指定机构）
    const excludedInstitutions = [
        '(01100019) 泰安续保业务部',
        '(01100014) 电子商务部',
        '(01100004) 农业险一部'
    ];
    
    let positiveGrowth = 0;
    let negativeGrowth = 0;
    
    if (latestDate2025 && latestDate2026) {
        const dateData2025 = detailData[2025][latestDate2025];
        const dateData2026 = detailData[2026][latestDate2026];
        
        if (dateData2025 && dateData2025.records && dateData2026 && dateData2026.records) {
            // 获取所有机构（排除指定机构）
            const allInsts = [...new Set([
                ...dateData2025.records.map(r => r.institution),
                ...dateData2026.records.map(r => r.institution)
            ])].filter(inst => !excludedInstitutions.includes(inst));
            
            allInsts.forEach(inst => {
                // 根据当前险种筛选条件计算该机构的保费
                const val2025 = dateData2025.records
                    .filter(r => r.institution === inst)
                    .filter(r => selectedCategories.includes('all') || selectedCategories.includes(r.category))
                    .reduce((sum, r) => sum + (parseFloat(r.premium) || 0), 0);
                
                const val2026 = dateData2026.records
                    .filter(r => r.institution === inst)
                    .filter(r => selectedCategories.includes('all') || selectedCategories.includes(r.category))
                    .reduce((sum, r) => sum + (parseFloat(r.premium) || 0), 0);
                
                // 只统计有数据的机构
                if (val2025 > 0 || val2026 > 0) {
                    if (val2026 > val2025) {
                        positiveGrowth++;
                    } else if (val2026 < val2025) {
                        negativeGrowth++;
                    }
                    // 相等时不统计
                }
            });
        }
    }
    
    document.getElementById('dateRange').innerHTML = 
        '同比正增机构：<span style="color:#28a745;font-weight:bold;">' + positiveGrowth + '</span>个<br>' +
        '同比负增机构：<span style="color:#dc3545;font-weight:bold;">' + negativeGrowth + '</span>个';
}

// ============================================
// 计算预算进度（全年2400万任务）
// ============================================
function calculateBudgetProgress(dateStr, yearlyTarget) {
    // dateStr格式: 2026-03-04
    const year = parseInt(dateStr.substring(0, 4));
    const month = parseInt(dateStr.substring(5, 7));
    const day = parseInt(dateStr.substring(8, 10));
    
    // 计算当年1月1日到该日期的天数
    const startOfYear = new Date(year, 0, 1);
    const currentDate = new Date(year, month - 1, day);
    const dayOfYear = Math.floor((currentDate - startOfYear) / (1000 * 60 * 60 * 24)) + 1;
    
    // 预算进度 = 年目标 / 365 * 已过天数
    return (yearlyTarget / 365 * dayOfYear);
}

// ============================================
// 更新图表 - X轴为月-日，两条折线按同期对比
// ============================================
function updateChart() {
    const ctx = document.getElementById('premiumChart').getContext('2d');
    
    // 提取所有日期的月-日部分（MM-DD）
    function extractMonthDay(dateStr) {
        return dateStr.substring(5); // 从第6位开始取，即 "2025-03-04" → "03-04"
    }
    
    // 获取所有唯一的月-日（从所有日期中提取）
    const allDates = [...new Set([
        ...Object.keys(detailData[2025]),
        ...Object.keys(detailData[2026])
    ])].sort();
    
    const uniqueMonthDays = [...new Set(allDates.map(extractMonthDay))].sort();
    
    // 构建2025年数据映射（月-日 → 保费）
    const map2025 = {};
    Object.keys(detailData[2025]).forEach(date => {
        const md = extractMonthDay(date);
        map2025[md] = calculateFilteredPremium(2025, date);
    });
    
    // 构建2026年数据映射（月-日 → 保费）
    const map2026 = {};
    Object.keys(detailData[2026]).forEach(date => {
        const md = extractMonthDay(date);
        map2026[md] = calculateFilteredPremium(2026, date);
    });
    
    // 准备两条线的数据（按X轴顺序）
    const data2025 = uniqueMonthDays.map(md => ({
        x: md,
        y: map2025[md] || 0
    }));
    
    const data2026 = uniqueMonthDays.map(md => ({
        x: md,
        y: map2026[md] || 0
    }));
    
    // ============================================
    // 准备2026年堆积柱状图数据（合并为3大类：车险、农险、非车险）

    const groupColors = {

        '农险': '#28a745',      // 绿色
        '非车险': '#4A90E2'     // 蓝色
    };
    
    // 定义险种分组
    const vehicleCategories = ['(03) 机动车辆险', '(13) 涉车产品'];
    const agricultureCategories = ['(11) 农业险'];

    function hasSelectedInGroup(groupCategories) {
        return groupCategories.some(cat => selectedCategories.includes(cat));

    // 计算某大类每日保费
    function calcGroupPremium(groupCategories, md) {
        const fullDate = Object.keys(detailData[2026]).find(d => extractMonthDay(d) === md);
        if (!fullDate) return 0;
        
        const dateData = detailData[2026][fullDate];
        if (!dateData || !dateData.records) return 0;

        const premium = dateData.records

        return premium / 10000; // 转换为万元

    // 计算某大类某日期保费环比（当前日期减上一个日期）
    function calcGroupPremiumChange(groupCategories, md) {
        const currentIndex = uniqueMonthDays.indexOf(md);
        if (currentIndex <= 0) return null; // 第一个日期没有环比
        
        const currentVal = calcGroupPremium(groupCategories, md);
        const prevMd = uniqueMonthDays[currentIndex - 1];
        const prevVal = calcGroupPremium(groupCategories, prevMd);
        
        return currentVal - prevVal;
    }
    
    // 计算非车险某日期保费

        const fullDate = Object.keys(detailData[2026]).find(d => extractMonthDay(d) === md);

                            // 三列左对齐布局：标签列 | 保费列 | 环比列
                            function formatLineLeft(label, val, change) {
                                // 第1列：标签，左对齐，视觉宽度占6
                                const col1Width = 6;
                                const col1Padding = ' '.repeat(Math.max(0, col1Width - visualWidth(label)));
                                const col1 = label + col1Padding;
                                
                                // 第2列：保费，左对齐，视觉宽度占10
                                const col2Width = 10;
                                const valStr = val.toFixed(2) + '万';
                                const col2Padding = ' '.repeat(Math.max(0, col2Width - visualWidth(valStr)));
                                const col2 = valStr + col2Padding;
                                
                                let line = col1 + ' ' + col2;
                                
                                if (change !== null) {
                                    const emoji = change >= 0 ? '📈' : '📉';
                                    const sign = change >= 0 ? '+' : '';
                                    line += '环比' + emoji + sign + change.toFixed(2) + '万';
                                }
                                return line;
                            }
                            
                            // 2025和2026年数据左对齐显示
                            function formatYearLineLeft(year, val) {
                                const col1Width = 6;
                                const col1Padding = ' '.repeat(Math.max(0, col1Width - visualWidth(year)));
                                const col1 = year + col1Padding;
                                
                                const col2Width = 10;
                                const valStr = val.toFixed(2) + '万';
                                const col2Padding = ' '.repeat(Math.max(0, col2Width - visualWidth(valStr)));
                                const col2 = valStr + col2Padding;
                                
                                return col1 + ' ' + col2;
                            }
                            
                            // 判断是否是全部险种
                            const isAllCategories = selectedCategories.includes('all');
                            
                            if (isAllCategories) {
                                // 全部险种：显示车险、非车险、农险分类汇总
                                const vehicleChange = calcGroupPremiumChange(vehicleCategories, md);
                                const nonVehicleChange = calcNonVehicleChange(md);
                                const agriChange = calcGroupPremiumChange(agricultureCategories, md);
                                
                                const vehicleVal = calcGroupPremium(vehicleCategories, md);
                                const nonVehicleVal = calcNonVehiclePremium(md);
                                const agriVal = calcGroupPremium(agricultureCategories, md);
                                
                                // 车 险（分散对齐非车险）
                                if (vehicleVal > 0 || vehicleChange !== null) {
                                    lines.push(formatLineLeft('车 险', vehicleVal, vehicleChange));
                                }
                                // 非车险
                                if (nonVehicleVal > 0 || nonVehicleChange !== null) {
                                    lines.push(formatLineLeft('非车险', nonVehicleVal, nonVehicleChange));
                                }
                                // 农 险（分散对齐非车险）
                                if (agriVal > 0 || agriChange !== null) {
                                    lines.push(formatLineLeft('农 险', agriVal, agriChange));
                                }
                                
                                // 保费小计（分散对齐非车险）
                                const totalVal = vehicleVal + nonVehicleVal + agriVal;
                                const totalChange = (vehicleChange !== null ? vehicleChange : 0) + 
                                                   (nonVehicleChange !== null ? nonVehicleChange : 0) + 
                                                   (agriChange !== null ? agriChange : 0);
                                const hasChange = vehicleChange !== null || nonVehicleChange !== null || agriChange !== null;
                                lines.push(formatLineLeft('小 计', totalVal, hasChange ? totalChange : null));
                            } else {
                                // 选择了具体险种：显示所选具体险种及其保费、环比
                                const selectedSpecificCategories = selectedCategories.filter(c => c !== 'all');
                                
                                selectedSpecificCategories.forEach(category => {
                                    // 计算该险种的保费
                                    const fullDate = Object.keys(detailData[2026]).find(d => extractMonthDay(d) === md);
                                    if (!fullDate) return;
                                    
                                    const dateData = detailData[2026][fullDate];
                                    if (!dateData || !dateData.records) return;
                                    
                                    const institutionFilter = document.getElementById('institutionSelect').value;
                                    
                                    const premium = dateData.records
                                        .filter(r => r.category === category)
                                        .filter(r => institutionFilter === 'all' || r.institution === institutionFilter)
                                        .reduce((sum, r) => sum + (parseFloat(r.premium) || 0), 0) / 10000;
                                    
                                    // 计算环比
                                    let change = null;
                                    const currentIndex = uniqueMonthDays.indexOf(md);
                                    if (currentIndex > 0) {
                                        const prevMd = uniqueMonthDays[currentIndex - 1];
                                        const prevDate = Object.keys(detailData[2026]).find(d => extractMonthDay(d) === prevMd);
                                        if (prevDate) {
                                            const prevData = detailData[2026][prevDate];
                                            if (prevData && prevData.records) {
                                                const prevPremium = prevData.records
                                                    .filter(r => r.category === category)
                                                    .filter(r => institutionFilter === 'all' || r.institution === institutionFilter)
                                                    .reduce((sum, r) => sum + (parseFloat(r.premium) || 0), 0) / 10000;
                                                change = premium - prevPremium;
                                            }
                                        }
                                    }
                                    
                                    // 简化险种名称显示（去掉括号内的编号）
                                    const shortName = category.replace(/\([^)]+\)\s*/, '');
                                    // 如果名称超过3个字，截断显示
                                    const displayName = shortName.length > 3 ? shortName.substring(0, 3) : shortName;
                                    
                                    lines.push(formatLineLeft(displayName, premium, change));
                                });
                                
                                // 计算保费小计（所有已选险种的总和）
                                let totalPremium = 0;
                                let prevTotalPremium = 0;
                                
                                const fullDate = Object.keys(detailData[2026]).find(d => extractMonthDay(d) === md);
                                const currentIndex = uniqueMonthDays.indexOf(md);
                                const prevMd = currentIndex > 0 ? uniqueMonthDays[currentIndex - 1] : null;
                                const prevDate = prevMd ? Object.keys(detailData[2026]).find(d => extractMonthDay(d) === prevMd) : null;
                                
                                const institutionFilter = document.getElementById('institutionSelect').value;
                                
                                if (fullDate && detailData[2026][fullDate]) {
                                    const dateData = detailData[2026][fullDate];
                                    if (dateData && dateData.records) {
                                        totalPremium = dateData.records
                                            .filter(r => selectedSpecificCategories.includes(r.category))
                                            .filter(r => institutionFilter === 'all' || r.institution === institutionFilter)
                                            .reduce((sum, r) => sum + (parseFloat(r.premium) || 0), 0) / 10000;
                                    }
                                }
                                
                                if (prevDate && detailData[2026][prevDate]) {
                                    const prevData = detailData[2026][prevDate];
                                    if (prevData && prevData.records) {
                                        prevTotalPremium = prevData.records
                                            .filter(r => selectedSpecificCategories.includes(r.category))
                                            .filter(r => institutionFilter === 'all' || r.institution === institutionFilter)
                                            .reduce((sum, r) => sum + (parseFloat(r.premium) || 0), 0) / 10000;
                                    }
                                }
                                
                                const totalChange = currentIndex > 0 ? totalPremium - prevTotalPremium : null;
                                lines.push(formatLineLeft('小计', totalPremium, totalChange));
                            }
                            
                            lines.push('────────────────────────'); // 分隔线
                            
                            lines.push(formatYearLineLeft('2025年', val2025));
                            
                            if (val2025 > 0) {
                                const growth = ((val2026 - val2025) / val2025 * 100);
                                const emoji = growth >= 0 ? '📈' : '📉';
                                const sign = growth >= 0 ? '+' : '';
                                lines.push(formatYearLineLeft('2026年', val2026) + '同比' + emoji + sign + growth.toFixed(2) + '%');
                            } else {
                                lines.push(formatYearLineLeft('2026年', val2026));
                            }
                            
                            // 如果有预算进度，显示预算进度和差额
                            if (valBudget > 0) {
                                const diff = valBudget - val2026;
                                const emoji = diff >= 0 ? '🔴' : '🟢';
                                const diffSign = diff >= 0 ? '+' : '';
                                
                                const label = '预算进度';
                                const col1Width = 6;
                                const col1Padding = ' '.repeat(Math.max(0, col1Width - visualWidth(label)));
                                const col1 = label + col1Padding;
                                
                                const col2Width = 10;
                                const valStr = valBudget.toFixed(2) + '万';
                                const col2Padding = ' '.repeat(Math.max(0, col2Width - visualWidth(valStr)));
                                const col2 = valStr + col2Padding;
                                
                                lines.push(col1 + ' ' + col2 + '差额' + emoji + diffSign + diff.toFixed(2) + '万');
                            }
                            
                            return lines;
                        }
                    }
                }
            },
            scales: {
                x: {
                    type: 'category',
                    title: {
                        display: true,
                        text: '日期',
                        font: { size: 14, weight: 'bold' }
                    },
                    ticks: {
                        maxRotation: 45,
                        minRotation: 30,
                        font: { size: 12 },
                        callback: function(value, index) {
                            // 将 MM-DD 格式转换为 M月D日
                            const label = this.getLabelForValue(value);
                            if (label && label.includes('-')) {
                                const parts = label.split('-');
                                return parseInt(parts[0]) + '月' + parseInt(parts[1]) + '日';
                            }
                            return label;
                        }
                    },
                    grid: { display: false }
                },
                y: {
                    title: {
                        display: true,
                        text: '保费收入（万元）',
                        font: { size: 14, weight: 'bold' }
                    },
                    ticks: {
                        callback: function(value) {
                            const num = parseFloat(value);
                            return isNaN(num) ? '' : num.toFixed(0);
                        }
                    },
                    grid: { color: 'rgba(0,0,0,0.05)' }
                }
            }
        }
    });
}

// ============================================
// 各机构险种分布堆积柱状图（不与筛选联动）
// ============================================
let institutionStackChart = null;

// 获取机构数据（支持累计或当日新增模式）
function getInstitutionData(mode) {
    // 获取2026年最新日期（没有则用2025年）
    const dates2026 = Object.keys(detailData[2026]).sort();
    const dates2025 = Object.keys(detailData[2025]).sort();
    const latestDate = dates2026.length > 0 ? dates2026[dates2026.length - 1] : 
                      (dates2025.length > 0 ? dates2025[dates2025.length - 1] : null);
    
    if (!latestDate) return null;
    
    const year = dates2026.length > 0 && dates2026.includes(latestDate) ? 2026 : 2025;
    const yearDates = year === 2026 ? dates2026 : dates2025;
    const currentIndex = yearDates.indexOf(latestDate);
    const prevDate = currentIndex > 0 ? yearDates[currentIndex - 1] : null;
    
    // 险种分组定义
    const vehicleCategories = ['(03) 机动车辆险', '(13) 涉车产品'];
    const agricultureCategories = ['(11) 农业险'];
    
    // 需要隐藏的机构列表
    const hiddenInstitutions = [
        '(01100004) 农业险一部',
        '(01100014) 电子商务部',
        '(01100019) 泰安续保业务部'
    ];
    
    function getCategoryGroup(category) {
        if (vehicleCategories.includes(category)) return '车险';
        if (agricultureCategories.includes(category)) return '农险';
        return '非车险';
    }
    
    // 计算机构数据
    function calcInstitutionData(date, isDelta) {
        const dateData = detailData[year][date];
        if (!dateData || !dateData.records) return {};
        
        const data = {};
        allInstitutions.forEach(inst => {
            data[inst] = { '车险': 0, '农险': 0, '非车险': 0, total: 0 };
        });
        
        dateData.records.forEach(record => {
            const group = getCategoryGroup(record.category);
            const premium = parseFloat(record.premium) || 0;
            if (data[record.institution]) {
                data[record.institution][group] += premium;
                data[record.institution].total += premium;
            }
        });
        return data;
    }
    
    const currentData = calcInstitutionData(latestDate, false);
    
    if (mode === 'daily' && prevDate) {
        // 当日新增模式：计算差值
        const prevData = calcInstitutionData(prevDate, false);
        const deltaData = {};
        allInstitutions.forEach(inst => {
            deltaData[inst] = {
                '车险': Math.max(0, (currentData[inst]?.['车险'] || 0) - (prevData[inst]?.['车险'] || 0)),
                '农险': Math.max(0, (currentData[inst]?.['农险'] || 0) - (prevData[inst]?.['农险'] || 0)),
                '非车险': Math.max(0, (currentData[inst]?.['非车险'] || 0) - (prevData[inst]?.['非车险'] || 0)),
                total: Math.max(0, (currentData[inst]?.total || 0) - (prevData[inst]?.total || 0))
            };
        });
        return { data: deltaData, year, latestDate, prevDate, mode };
    } else {
        // 累计保费模式
        return { data: currentData, year, latestDate, prevDate: null, mode };
    }
}

// 更新堆积柱状图
function updateInstitutionStackChart() {
    const ctx = document.getElementById('institutionStackChart');
    if (!ctx) return;
    
    // 获取当前模式
    const mode = document.querySelector('input[name="stackChartMode"]:checked')?.value || 'cumulative';
    const result = getInstitutionData(mode);
    
    if (!result) {
        console.log('没有数据可显示');
        return;
    }
    
    const { data: institutionData, year, latestDate, prevDate, mode: currentMode } = result;
    
    // 需要隐藏的机构列表
    const hiddenInstitutions = [
        '(01100004) 农业险一部',
        '(01100014) 电子商务部',
        '(01100019) 泰安续保业务部'
    ];
    
    // 过滤掉保费为0的机构和需要隐藏的机构，并按总保费降序排序
    const activeInstitutions = allInstitutions
        .filter(inst => institutionData[inst].total > 0 && !hiddenInstitutions.includes(inst))
        .sort((a, b) => institutionData[b].total - institutionData[a].total);
    
    // 提取机构名称（去掉代码前缀）
    const labels = activeInstitutions.map(inst => {
        const match = inst.match(/\)\s*(.+)$/);
        return match ? match[1] : inst;
    });
    
    // 转换为万元
    const vehicleData = activeInstitutions.map(inst => institutionData[inst]['车险'] / 10000);
    const agriData = activeInstitutions.map(inst => institutionData[inst]['农险'] / 10000);
    const nonVehicleData = activeInstitutions.map(inst => institutionData[inst]['非车险'] / 10000);
    const totalData = activeInstitutions.map(inst => institutionData[inst].total / 10000);
    
    // 销毁旧图表
    if (institutionStackChart) {
        institutionStackChart.destroy();
    }
    
    // 创建堆积柱状图
    institutionStackChart = new Chart(ctx, {
        type: 'bar',

                        align: 'top',
                        offset: 2,
                        color: '#FF6B6B',
                        font: { size: 12, weight: 'bold' },
                        formatter: function(value) {
                            return value > 0 ? value.toFixed(2) : '';
                        }
                    }
                },
                {
                    label: '非车险',
                    data: nonVehicleData,
                    backgroundColor: '#4A90E2',
                    borderColor: '#357ABD',
                    borderWidth: 1,
                    datalabels: {
                        display: function(context) {
                            return context.dataset.data[context.dataIndex] > 0;
                        },
                        anchor: 'end',
                        align: 'top',
                        offset: 2,
                        color: '#4A90E2',
                        font: { size: 12, weight: 'bold' },
                        formatter: function(value) {
                            return value > 0 ? value.toFixed(2) : '';
                        }
                    }
                },
                {
                    label: '农险',
                    data: agriData,
                    backgroundColor: '#28a745',
                    borderColor: '#1e7e34',
                    borderWidth: 1,
                    datalabels: {
                        display: function(context) {
                            return context.dataset.data[context.dataIndex] > 0;
                        },
                        anchor: 'end',
                        align: 'top',
                        offset: 2,
                        color: '#28a745',
                        font: { size: 12, weight: 'bold' },
                        formatter: function(value) {
                            return value > 0 ? value.toFixed(2) : '';
                        }
                    }
                },
                {
                    label: '总保费',
                    data: totalData,
                    backgroundColor: 'transparent',
                    borderColor: 'transparent',
                    borderWidth: 0,
                    datalabels: {
                        display: true,
                        anchor: 'end',
                        align: 'top',
                        offset: 15,
                        color: '#333',
                        font: { size: 15, weight: 'bold' },
                        backgroundColor: 'rgba(255,255,255,0.9)',
                        borderColor: '#999',
                        borderWidth: 1,
                        borderRadius: 4,
                        padding: { top: 2, bottom: 2, left: 5, right: 5 },
                        formatter: function(value) {
                            return value.toFixed(2) + '万';
                        }
                    },
                    // 隐藏这个数据集的柱子
                    barThickness: 0
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            layout: {
                padding: {
                    top: 30,
                    right: 20,
                    bottom: 10,
                    left: 10
                }
            },
            plugins: {
                title: {
                    display: true,
                    text: currentMode === 'daily' && prevDate 
                        ? `当日新增 (${year}年${latestDate.substring(5)} 相比 ${prevDate.substring(5)})`
                        : `累计保费 (${year}年${latestDate.substring(5)})`,
                    font: { size: 14, weight: 'bold' },
                    padding: { top: 10, bottom: 20 }
                },
                legend: {
                    display: true,
                    position: 'top',
                    labels: {
                        filter: function(item, chart) {
                            // 隐藏"总保费"图例
                            return item.text !== '总保费';
                        },

                        padding: 20,

                    }

                            }

// ============================================
// 更新机构汇总表格 - 各机构险种数据展示

function updateInstitutionTable() {

    // 获取筛选条件
    const institutionFilter = document.getElementById('institutionSelect').value;
    
    // 判断险种是否匹配
    function categoryMatch(category) {
        if (selectedCategories.includes('all')) return true;
        return selectedCategories.includes(category);
    }
    
    // 获取最新日期
    const dates2025 = Object.keys(detailData[2025]).sort();
    const dates2026 = Object.keys(detailData[2026]).sort();
    const latestDate2025 = dates2025[dates2025.length - 1];
    const latestDate2026 = dates2026[dates2026.length - 1];
    const prevDate2026 = dates2026.length > 1 ? dates2026[dates2026.length - 2] : null;
    
    // 更新日期标签
    const dateTag = document.getElementById('instTableDateTag');
    if (dateTag && latestDate2026) {
        dateTag.textContent = latestDate2026;
        dateTag.style.display = 'inline-block';
    }
    
    // 数据结构: institution -> category -> {daily, yearly2025, yearly2026}
    const instData = {};
    
    // 初始化机构数据
    allInstitutions.forEach(inst => {
        instData[inst] = {};
        allCategories.forEach(cat => {
            instData[inst][cat] = {
                daily2025: 0,      // 2025当日新增
                daily2026: 0,      // 2026当日新增
                yearly2025: 0,     // 2025年度累计
                yearly2026: 0      // 2026年度累计
            };
        });
    });
    
    // 计算2025年度累计（源数据已是累计值，直接取最新日期数据）
    if (latestDate2025 && detailData[2025][latestDate2025] && detailData[2025][latestDate2025].records) {
        detailData[2025][latestDate2025].records.forEach(record => {
            if (!categoryMatch(record.category)) return;
            if (institutionFilter !== 'all' && record.institution !== institutionFilter) return;
            if (instData[record.institution] && instData[record.institution][record.category]) {
                instData[record.institution][record.category].yearly2025 = parseFloat(record.premium) || 0;
            }
        });
    }
    
    // 计算2026年度累计（源数据已是累计值，直接取最新日期数据）
    if (latestDate2026 && detailData[2026][latestDate2026] && detailData[2026][latestDate2026].records) {
        detailData[2026][latestDate2026].records.forEach(record => {
            if (!categoryMatch(record.category)) return;
            if (institutionFilter !== 'all' && record.institution !== institutionFilter) return;
            if (instData[record.institution] && instData[record.institution][record.category]) {
                instData[record.institution][record.category].yearly2026 = parseFloat(record.premium) || 0;
            }
        });
    }
    
    // 计算当日新增（最新日期 - 前一日期）
    if (latestDate2026 && detailData[2026][latestDate2026] && detailData[2026][latestDate2026].records) {
        // 最新日期数据
        detailData[2026][latestDate2026].records.forEach(record => {
            if (!categoryMatch(record.category)) return;
            if (institutionFilter !== 'all' && record.institution !== institutionFilter) return;
            if (instData[record.institution] && instData[record.institution][record.category]) {
                instData[record.institution][record.category].daily2026 += parseFloat(record.premium) || 0;
            }
        });
        
        // 前一日期数据（用于计算当日新增）
        if (prevDate2026 && detailData[2026][prevDate2026] && detailData[2026][prevDate2026].records) {
            detailData[2026][prevDate2026].records.forEach(record => {
                if (!categoryMatch(record.category)) return;
                if (institutionFilter !== 'all' && record.institution !== institutionFilter) return;
                if (instData[record.institution] && instData[record.institution][record.category]) {
                    instData[record.institution][record.category].daily2026 -= parseFloat(record.premium) || 0;
                }
            });
        }
    }
    
    // 生成表格HTML
    let html = `
        <table>
            <thead>
                <tr>
                    <th style="width: 160px"><div style="text-align: center">机构 / 险种</div></th>
                    <th style="width: 85px"><div style="text-align: center">当日新增</div></th>
                    <th style="width: 85px"><div style="text-align: center">年度累计</div></th>
                    <th style="width: 80px"><div style="text-align: center">累计同比</div></th>
                </tr>
            </thead>
            <tbody>
    `;
    
    // 隐藏的机构列表
    const hiddenInstitutions = ['泰安续保业务部', '电子商务部', '农业险一部'];
    
    // 根据筛选条件确定要显示的险种列表
    let displayCategories = allCategories;
    if (!selectedCategories.includes('all')) {
        displayCategories = allCategories.filter(cat => selectedCategories.includes(cat));
    }
    
    // 计算泰安中支按险种汇总（包含所有机构）
    const taianData = {};
    displayCategories.forEach(cat => {
        taianData[cat] = { daily2026: 0, yearly2025: 0, yearly2026: 0 };
    });
    let totalDaily = 0, totalYearly2025 = 0, totalYearly2026 = 0;
    allInstitutions.forEach(inst => {
        // 如果筛选了特定机构，只汇总该机构数据
        if (institutionFilter !== 'all' && inst !== institutionFilter) return;
        const catData = instData[inst];
        displayCategories.forEach(cat => {
            taianData[cat].daily2026 += catData[cat].daily2026;
            taianData[cat].yearly2025 += catData[cat].yearly2025;
            taianData[cat].yearly2026 += catData[cat].yearly2026;
            totalDaily += catData[cat].daily2026;
            totalYearly2025 += catData[cat].yearly2025;
            totalYearly2026 += catData[cat].yearly2026;
        });
    });
    const totalGrowth = totalYearly2025 > 0 ? ((totalYearly2026 - totalYearly2025) / totalYearly2025 * 100) : (totalYearly2026 > 0 ? 100 : 0);
    const totalGrowthSign = totalGrowth >= 0 ? '+' : '';
    
    // 添加泰安中支总计行
    html += `<tr style="background: #4a5568; color: #fff;">`;
    html += `<td><div style="font-weight: 700;">泰安中支</div></td>`;
    html += `<td><div style="text-align: right">${formatPremium(totalDaily)}</div></td>`;
    html += `<td><div style="text-align: right">${formatPremium(totalYearly2026)}</div></td>`;
    html += `<td><div style="text-align: right; color: ${totalGrowth >= 0 ? '#90EE90' : '#FFB6C1'}; font-weight: 600;">${totalGrowthSign}${totalGrowth.toFixed(2)}%</div></td>`;
    html += '</tr>';
    
    // 添加泰安中支各险种行
    displayCategories.forEach((cat) => {
        const data = taianData[cat];
        if (data.yearly2025 > 0 || data.yearly2026 > 0 || data.daily2026 > 0) {
            const catName = cat.replace(/\(\d+\)\s*/, '');
            const growth = data.yearly2025 > 0 ? ((data.yearly2026 - data.yearly2025) / data.yearly2025 * 100) : (data.yearly2026 > 0 ? 100 : 0);
            const growthSign = growth >= 0 ? '+' : '';
            html += `<tr style="background: #4a5568; color: #fff;">`;
            html += `<td><div style="text-align: right; padding-right: 12px;">${catName}</div></td>`;
            html += `<td><div style="text-align: right">${formatPremium(data.daily2026)}</div></td>`;
            html += `<td><div style="text-align: right">${formatPremium(data.yearly2026)}</div></td>`;
            html += `<td><div style="text-align: right; color: ${growth >= 0 ? '#90EE90' : '#FFB6C1'}; font-weight: 600;">${growthSign}${growth.toFixed(2)}%</div></td>`;
            html += '</tr>';
        }
    });
    
    // 按机构遍历（过滤掉指定机构）
    let hasData = false;
    let displayIndex = 0;
    const sortedInstitutions = allInstitutions.slice().sort();
    
    sortedInstitutions.forEach((institution, instIndex) => {
        const instNameRaw = institution.replace(/\(\d+\)\s*/, '');
        // 过滤掉隐藏的机构
        if (hiddenInstitutions.includes(instNameRaw)) return;
        // 如果筛选了特定机构，只显示该机构
        if (institutionFilter !== 'all' && institution !== institutionFilter) return;
        
        const catData = instData[institution];
        // 筛选出有数据的险种（年度累计不为0的且在筛选列表中的）
        const validCategories = displayCategories.filter(cat => {
            const data = catData[cat];
            return data.yearly2025 > 0 || data.yearly2026 > 0 || data.daily2026 > 0;
        });
        
        if (validCategories.length === 0) return;
        hasData = true;
        
        // 计算该机构小计
        let instDailyTotal = 0;
        let instYearly2025Total = 0;
        let instYearly2026Total = 0;
        validCategories.forEach(cat => {
            instDailyTotal += catData[cat].daily2026;
            instYearly2025Total += catData[cat].yearly2025;
            instYearly2026Total += catData[cat].yearly2026;
        });
        const instGrowth = instYearly2025Total > 0 ? ((instYearly2026Total - instYearly2025Total) / instYearly2025Total * 100) : (instYearly2026Total > 0 ? 100 : 0);
        const instGrowthSign = instGrowth >= 0 ? '+' : '';
        const instGrowthColor = instGrowth >= 0 ? '#28a745' : '#dc3545';
        
        // 交替背景色
        const instBg = displayIndex % 2 === 0 ? '#f8f9fa' : '#fff';
        
        // 机构总计行（第一行）
        html += `<tr style="background: ${instBg};">`;
        html += `<td><div style="font-weight: 700;">${instNameRaw}</div></td>`;
        html += `<td><div style="text-align: right">${formatPremium(instDailyTotal)}</div></td>`;
        html += `<td><div style="text-align: right">${formatPremium(instYearly2026Total)}</div></td>`;
        html += `<td><div style="text-align: right; color: ${instGrowthColor}; font-weight: 600;">${instGrowthSign}${instGrowth.toFixed(2)}%</div></td>`;
        html += '</tr>';
        
        // 各险种行
        validCategories.forEach((cat) => {
            const data = catData[cat];
            const catName = cat.replace(/\(\d+\)\s*/, '');
            const growth = data.yearly2025 > 0 ? ((data.yearly2026 - data.yearly2025) / data.yearly2025 * 100) : (data.yearly2026 > 0 ? 100 : 0);
            const growthSign = growth >= 0 ? '+' : '';
            const growthColor = growth >= 0 ? '#28a745' : '#dc3545';
            
            html += `<tr style="background: ${instBg};">`;
            html += `<td><div style="text-align: right; padding-right: 12px;">${catName}</div></td>`;
            html += `<td><div style="text-align: right">${formatPremium(data.daily2026)}</div></td>`;
            html += `<td><div style="text-align: right">${formatPremium(data.yearly2026)}</div></td>`;
            html += `<td><div style="text-align: right; color: ${growthColor}; font-weight: 600;">${growthSign}${growth.toFixed(2)}%</div></td>`;
            html += '</tr>';
        });
        
        displayIndex++;
    });
    
    if (!hasData) {
        container.innerHTML = `
            <div class="empty-state">
                <p>没有找到符合条件的数据</p>
            </div>
        `;
        return;
    }
    
    html += '</tbody></table>';
    container.innerHTML = html;
}

// ============================================
// 更新数据表格 - 只显示最新日期的数据（不要累加不同日期）
// ============================================
function updateTable() {
    const institutionFilter = document.getElementById('institutionSelect').value;
    const container = document.getElementById('tableContainer');
    
    // 如果容器不存在，直接返回
    if (!container) return;
    
    // 获取最新日期
    const dates2025 = Object.keys(detailData[2025]).sort();
    const dates2026 = Object.keys(detailData[2026]).sort();
    const latestDate2025 = dates2025[dates2025.length - 1];
    const latestDate2026 = dates2026[dates2026.length - 1];
    
    // 判断险种是否匹配
    function categoryMatch(category) {
        if (selectedCategories.includes('all')) return true;
        return selectedCategories.includes(category);
    }
    
    // 只汇总最新日期的数据（不要累加不同日期）
    const summaryMap = new Map();
    
    // 只处理2025年最新日期的数据
    if (latestDate2025 && detailData[2025][latestDate2025]) {
        const dateData = detailData[2025][latestDate2025];
        if (dateData.records) {
            dateData.records.forEach(record => {
                if (!categoryMatch(record.category)) return;
                if (institutionFilter !== 'all' && record.institution !== institutionFilter) return;
                
                const key = record.category + '|' + record.institution;
                if (!summaryMap.has(key)) {
                    summaryMap.set(key, {
                        category: record.category,
                        institution: record.institution,
                        y2025: 0,
                        y2026: 0
                    });
                }
                summaryMap.get(key).y2025 += (parseFloat(record.premium) || 0);
            });
        }
    }
    
    // 只处理2026年最新日期的数据
    if (latestDate2026 && detailData[2026][latestDate2026]) {
        const dateData = detailData[2026][latestDate2026];
        if (dateData.records) {
            dateData.records.forEach(record => {
                if (!categoryMatch(record.category)) return;
                if (institutionFilter !== 'all' && record.institution !== institutionFilter) return;
                
                const key = record.category + '|' + record.institution;
                if (!summaryMap.has(key)) {
                    summaryMap.set(key, {
                        category: record.category,
                        institution: record.institution,
                        y2025: 0,
                        y2026: 0
                    });
                }
                summaryMap.get(key).y2026 += (parseFloat(record.premium) || 0);
            });
        }
    }
    
    // 转换为数组并按同比增长率排序（由高到低）
    const summaryArray = Array.from(summaryMap.values())
        .sort((a, b) => {
            const growthA = a.y2025 > 0 ? ((a.y2026 - a.y2025) / a.y2025 * 100) : (a.y2026 > 0 ? 100 : 0);
            const growthB = b.y2025 > 0 ? ((b.y2026 - b.y2025) / b.y2025 * 100) : (b.y2026 > 0 ? 100 : 0);
            return growthB - growthA;  // 由高到低
        });

    if (summaryArray.length === 0) {
        container.innerHTML = `
            <div class="empty-state">
                <p>没有找到符合条件的数据</p>
            </div>
        `;
        return;
    }

    let html = `
        <table>
            <thead>
                <tr>
                    <th>四级机构</th>
                    <th>险种大类</th>
                    <th style="text-align: right">2025年(万元)</th>
                    <th style="text-align: right">2026年(万元)</th>
                    <th style="text-align: right">同比增长</th>
                </tr>
            </thead>
            <tbody>
    `;

    summaryArray.forEach(item => {
        const growth = item.y2025 > 0 ? ((item.y2026 - item.y2025) / item.y2025 * 100) : (item.y2026 > 0 ? 100 : 0);
        const growthSign = growth >= 0 ? '+' : '';
        const growthColor = growth >= 0 ? '#28a745' : '#dc3545';
        
        // 转换为万元
        const y2025Wan = ((parseFloat(item.y2025) || 0) / 10000).toFixed(2);
        const y2026Wan = ((parseFloat(item.y2026) || 0) / 10000).toFixed(2);
        
        html += `
            <tr>
                <td>${item.institution}</td>
                <td>${item.category}</td>
                <td style="text-align: right;">${y2025Wan} <small>万</small></td>
                <td style="text-align: right; font-weight: 600; color: #667eea;">${y2026Wan} <small>万</small></td>
                <td style="text-align: right; font-weight: 600; color: ${growthColor};">
                    ${growthSign}${(parseFloat(growth) || 0).toFixed(2)}%
                </td>
            </tr>
        `;
    });

    html += '</tbody></table>';
    container.innerHTML = html;
}

// ============================================
// 格式化数字
// ============================================
function formatNumber(num) {
    return num.toLocaleString('zh-CN', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
    });
}

// 监听筛选器变化
// ============================================
document.getElementById('institutionSelect').addEventListener('change', function() {
    updateChart();
    updateTable();
    updateInstitutionTable();
    updateStatsCards();
});
