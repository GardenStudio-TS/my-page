<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>泰安车险市场保费监测</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    padding:10px;background:#eef1f5;display:flex;align-items:flex-start;gap:10px;min-height:100vh
}
.header{
    flex:0 0 100px;background:linear-gradient(180deg,#0B82D3,#1a8fe3);
    color:#fff;border-radius:10px;padding:12px 8px;text-align:center;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px
}
.header h1{font-size:20px;font-weight:700;writing-mode:vertical-lr;letter-spacing:4px}
.header p{font-size:11px;opacity:0.85}
.v-text{font-size:13px;opacity:0.85;writing-mode:vertical-lr;letter-spacing:2px;line-height:1.6}
.card{
    background:#fff;border-radius:10px;padding:14px;margin-bottom:10px;
    box-shadow:0 2px 8px rgba(0,0,0,0.06)
}
.card h2{
    font-size:15px;color:#0B82D3;margin-bottom:8px;
    padding-bottom:6px;border-bottom:2px solid #e8f0f8
}
.card canvas{max-height:200px}
.cards-container{
    flex:1;display:flex;flex-wrap:wrap;gap:10px;min-width:0
}
.main{
    flex:1;display:flex;flex-direction:column;gap:10px;min-width:0
}
.cards-container .card{
    flex:1;min-width:0;padding:8px;margin-bottom:0
}
.filter-bar{
    display:flex;flex-wrap:wrap;gap:4px 6px;margin-bottom:8px;
    padding:6px 0;border-bottom:1px solid #e8f0f8
}
.ckb{
    font-size:11px;color:#555;cursor:pointer;display:inline-flex;align-items:center;gap:2px
}
.ckb input{accent-color:#0B82D3;cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:12px}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -2px}
.tbl-wrap table{min-width:0;width:100%}
thead th{
    background:#f0f5fb;color:#333;padding:5px 3px;text-align:right;
    font-weight:600;border-bottom:2px solid #d0dce8;font-size:11px;cursor:pointer;user-select:none
}
thead th:nth-child(2){text-align:left;padding-left:6px}
th.num{text-align:center;width:28px;padding:5px 2px;cursor:default}
th.num:hover{background:#f0f5fb}
thead th:hover{background:#e4edf6}
th .sort-ind{font-size:10px;margin-left:2px;color:#999}
tbody td{
    padding:4px 3px;text-align:right;border-bottom:1px solid #f0f0f0;
    font-variant-numeric:tabular-nums;font-size:11px
}
tbody td:first-child{text-align:center;color:#999;font-size:10px}
tbody td:nth-child(2){text-align:left;font-weight:500;padding-left:6px}
tbody tr:nth-child(even){background:#fafbfc}
tr.tot{background:#e8f2fb !important;font-weight:700;border-top:2px solid #0B82D3}
tr.tot td{padding:7px 5px;font-size:13px}
.down{color:#d93025}
.up{color:#188038}
.zero{color:#999}
.highlight{background:#fff3cd !important}
.selected-row{background:#cce5ff !important;outline:2px solid #0B82D3;outline-offset:-2px}
#tbody1 tr{cursor:pointer}
.up-arrow{color:#188038;font-size:11px;margin-left:1px}
.down-arrow{color:#d93025;font-size:11px;margin-left:1px}
.flat-arrow{color:#999;font-size:11px;margin-left:1px}
.lnk-wrap{text-align:center}
.lnk-wrap label{font-size:11px;color:#fff;opacity:0.9;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.lnk-wrap input{accent-color:#fff;width:12px;height:12px;cursor:pointer}
.ne-select{font-size:11px;color:#fff;background:transparent;border:1px solid rgba(255,255,255,0.4);border-radius:4px;padding:2px 4px;cursor:pointer;text-align:center;width:60px}
.ne-select option{color:#333;background:#fff}
@media (max-width:600px){
body{flex-direction:column;min-height:auto}
.main{width:100%}
.header{flex:0 0 auto;flex-direction:row;flex-wrap:wrap;justify-content:center;gap:4px 10px;padding:10px;position:static}
.header h1{writing-mode:horizontal-tb;font-size:15px;letter-spacing:1px}
.v-text{writing-mode:horizontal-tb;font-size:11px;letter-spacing:1px;line-height:1.4}
.lnk-wrap label{flex-direction:row}
.cards-container .card{min-width:0;flex:1 1 100%}
}
</style>
</head>

function getNe() { return document.getElementById('neSelect').value; }
function onNeChange() {
    renderTable('t1');renderTable('t2');renderTable('t3');
    setTimeout(updateCharts, 50);setTimeout(updateUsageCharts, 50);
}

function getChartData() {
    var sel = getSelectedUsage('t1');
    var neVal = getNe();
    var labels = [], shareData = [], yoyData = [];
    for (var fi = 0; fi < CHART_RAW.length; fi++) {
        var file = CHART_RAW[fi];
        labels.push(file.date);
        var agg = {};
        for (var i = 0; i < file.data.length; i++) {
            var d = file.data[i];
            if (neVal !== 'all' && d.n !== neVal) continue;
            if (!sel[d.u]) continue;
            if (!agg[d.c]) agg[d.c] = {p:0, tp:0};
            agg[d.c].p += d.p;
            agg[d.c].tp += d.tp;
        }
        var tP = 0, tTp = 0;
        for (var c in agg) { tP += agg[c].p; tTp += agg[c].tp; }
        var compP = 0, compTp = 0;
        if (selectedCompany && agg[selectedCompany]) {
            compP = agg[selectedCompany].p;
            compTp = agg[selectedCompany].tp;
        } else {
            compP = tP;
            compTp = tTp;
        }
        shareData.push(tP > 0 ? (compP / tP * 100) : 0);
        yoyData.push(compTp > 0 ? ((compP / compTp - 1) * 100) : null);
    }
    return {labels: labels, shareData: shareData, yoyData: yoyData};
}

function updateCharts() {
    var d = getChartData();
    var label = selectedCompany ? selectedCompany : '泰安全市场';
    var shareOpts = {
        type: 'line',
        data: {
            labels: d.labels,
            datasets: [{
                label: label + ' 市场占比',
                data: d.shareData,
                borderColor: '#0B82D3', backgroundColor: '#0B82D322',
                fill: true, tension: 0.3, pointRadius: 5, pointHitRadius: 10
            }]
        },
        options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { display: true, labels: { font: { size: 12 } } } },
            scales: {
                x: { ticks: { font: { size: 12 } } },
                y: { ticks: { font: { size: 12 }, callback: function(v) { return v.toFixed(2) + '%'; } } }
            }
        }
    };
    // 数据标签插件
    var dataLabelPlugin = {
        id: 'dataLabels',
        afterDraw: function(chart) {
            var ctx = chart.ctx;
            chart.data.datasets.forEach(function(ds, di) {
                var meta = chart.getDatasetMeta(di);
                meta.data.forEach(function(el, i) {
                    var val = ds.data[i];
                    if (val === null) return;
                    ctx.fillStyle = '#333';
                    ctx.font = '12px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'bottom';
                    ctx.fillText(val.toFixed(2) + '%', el.x, el.y - 8);
                });
            });
        }
    };
    var yoyOpts = JSON.parse(JSON.stringify(shareOpts));
    yoyOpts.data.datasets[0].label = label + ' 同比';
    yoyOpts.data.datasets[0].data = d.yoyData;
    yoyOpts.options.scales.y.ticks.callback = function(v) { return v.toFixed(2) + '%'; };
    
    if (chartShare) { chartShare.destroy(); }
    if (chartYoy) { chartYoy.destroy(); }
    chartShare = new Chart(document.getElementById('chartShare'), {...shareOpts, plugins: [dataLabelPlugin]});
    var yoyCfg = {...yoyOpts, plugins: [dataLabelPlugin]};
    chartYoy = new Chart(document.getElementById('chartYoy'), yoyCfg);
}

    for (var fi = 0; fi < CHART_RAW.length; fi++) {
        var file = CHART_RAW[fi];
        labels.push(file.date);
        // 全市场汇总（不受公司选择影响）
        var marketAgg = {};
        for (var i = 0; i < file.data.length; i++) {
            var d = file.data[i];
            if (neVal !== 'all' && d.n !== neVal) continue;
            if (!marketAgg[d.u]) marketAgg[d.u] = {p:0};
            marketAgg[d.u].p += d.p;
        }
        var marketTotalP = 0;
        for (var u in marketAgg) { marketTotalP += marketAgg[u].p; }
        // 公司筛选汇总
        var compAgg = {};
        for (var i = 0; i < file.data.length; i++) {
            var d = file.data[i];
            if (neVal !== 'all' && d.n !== neVal) continue;
            if (selectedCompany && d.c !== selectedCompany) continue;
            if (!compAgg[d.u]) compAgg[d.u] = {p:0, tp:0};
            compAgg[d.u].p += d.p;
            compAgg[d.u].tp += d.tp;
        }
        for (var u in compAgg) { allUsageTypes[u] = true; }
        fileData.push({compAgg: compAgg, marketTotalP: marketTotalP});
    }
    var sortedUsages = USAGE_TYPES.filter(function(u) { return allUsageTypes[u]; });
    // 数据标签插件（同上方的图一致）
    var dataLabelPlugin = {
        id: 'usageDataLabels',
        afterDraw: function(chart) {
            var ctx = chart.ctx;
            chart.data.datasets.forEach(function(ds, di) {
                var meta = chart.getDatasetMeta(di);
                meta.data.forEach(function(el, i) {
                    var val = ds.data[i];
                    if (val === null) return;
                    ctx.fillStyle = ds.borderColor;
                    ctx.font = '10px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'bottom';
                    ctx.fillText(val.toFixed(2) + '%', el.x, el.y - 6);
                });
            });
        }
    };
    function makeUsageChart(canvasId, field) {
        var datasets = [];
        for (var ui = 0; ui < sortedUsages.length; ui++) {
            var u = sortedUsages[ui];
            var dataArr = [];
            for (var fi = 0; fi < fileData.length; fi++) {
                var fd = fileData[fi];
                var scopeTotal = 0; for (var uu in fd.compAgg) { scopeTotal += fd.compAgg[uu].p; }
                if (fd.compAgg[u]) {
                    if (field === 'share') {
                        dataArr.push(scopeTotal > 0 ? (fd.compAgg[u].p / scopeTotal * 100) : 0);
                    } else {
                        dataArr.push(fd.compAgg[u].tp > 0 ? ((fd.compAgg[u].p / fd.compAgg[u].tp - 1) * 100) : null);
                    }
                } else {
                    dataArr.push(null);
                }
            }
            var checked = sel[u] !== undefined;
            datasets.push({
                label: u,
                data: dataArr,
                borderColor: checked ? (USAGE_COLORS[u] || '#999') : '#ccc',
                backgroundColor: 'transparent',
                borderDash: checked ? [] : [4,4],
                pointRadius: checked ? 3 : 2,
                pointBackgroundColor: checked ? (USAGE_COLORS[u] || '#999') : '#ddd',
                tension: 0.3
            });
        }
        var chart = new Chart(document.getElementById(canvasId), {
            type: 'line',
            data: {labels: labels, datasets: datasets},
            options: {
                responsive: true, maintainAspectRatio: false,
                plugins: { legend: { display: true, labels: { font: { size: 10 }, boxWidth: 12, padding: 8 } } },
                scales: {
                    x: { ticks: { font: { size: 11 } } },
                    y: { ticks: { font: { size: 11 }, callback: function(v) { return v.toFixed(2) + '%'; } } }
                }
            },
            plugins: [dataLabelPlugin]
        });
        return chart;
    }
    if (chartUsageShare) { chartUsageShare.destroy(); }
    if (chartUsageYoy) { chartUsageYoy.destroy(); }
    chartUsageShare = makeUsageChart('chartUsageShare', 'share');
    chartUsageYoy = makeUsageChart('chartUsageYoy', 'yoy');
}

function getSelectedUsage(prefix) {
    var cbs = document.querySelectorAll('.' + prefix + '-cb:checked');
    var sel = {};
    cbs.forEach(function(cb) { sel[cb.value] = true; });
    return sel;
}

function toggleAll(prefix) {
    var master = document.getElementById(prefix + '-all');
    var cbs = document.querySelectorAll('.' + prefix + '-cb');
    cbs.forEach(function(cb) { cb.checked = master.checked; });
    if (document.getElementById('lnkToggle').checked) {
        syncFrom(prefix);
        renderTable('t1');renderTable('t2');renderTable('t3');
    } else {
        renderTable(prefix);
    }
}

function onCbChange(prefix) {
    var all = document.querySelectorAll('.' + prefix + '-cb');
    var checked = document.querySelectorAll('.' + prefix + '-cb:checked');
    document.getElementById(prefix + '-all').checked = (all.length === checked.length);
    if (document.getElementById('lnkToggle').checked) {
        syncFrom(prefix);
        renderTable('t1');renderTable('t2');renderTable('t3');
    } else {
        renderTable(prefix);
    }
}

function syncFrom(prefix) {
    var targets = ['t1','t2','t3'].filter(function(p) { return p !== prefix; });
    var srcCbs = document.querySelectorAll('.' + prefix + '-cb');
    targets.forEach(function(tp) {
        var tgtCbs = document.querySelectorAll('.' + tp + '-cb');
        for (var i = 0; i < srcCbs.length; i++) {
            tgtCbs[i].checked = srcCbs[i].checked;
        }
        var all = document.querySelectorAll('.' + tp + '-cb');
        var checked = document.querySelectorAll('.' + tp + '-cb:checked');
        document.getElementById(tp + '-all').checked = (all.length === checked.length);
    });
}

function onLinkChange() {
    if (document.getElementById('lnkToggle').checked) {
        syncFrom('t1');
    }
    renderTable('t1');renderTable('t2');renderTable('t3');
}

function fmt(v) {
    return v.toLocaleString('zh-CN', {minimumFractionDigits:2, maximumFractionDigits:2});
}

function getFilteredData(prefix) {
    var DATA = ALL_DATA[prefix];
    var sel = getSelectedUsage(prefix);
    var neVal = getNe();
    var agg = {};
    for (var i = 0; i < DATA.length; i++) {
        var d = DATA[i];
        if (neVal !== 'all' && d.n !== neVal) continue;
        if (!sel[d.u]) continue;
        if (!agg[d.c]) agg[d.c] = {p:0, tp:0};
        agg[d.c].p += d.p;
        agg[d.c].tp += d.tp;
    }
    var tP = 0, tTp = 0;
    for (var c in agg) { tP += agg[c].p; tTp += agg[c].tp; }
    var rows = [];
    for (var c in agg) {
        var p = agg[c].p;
        var tp = agg[c].tp;
        var share = (tP > 0) ? (p / tP * 100) : 0;
        var yoy = (tp > 0) ? (p / tp - 1) * 100 : null;
        rows.push({c:c, p:p, tp:tp, yoy:yoy, share:share});
    }
    return {rows: rows, tP: tP, tTp: tTp};
}

function renderTable(prefix) {
    var result = getFilteredData(prefix);
    var rows = result.rows;
    var tP = result.tP, tTp = result.tTp;
    var tbodyId = ALL_TBODIES[prefix];
    
    // 更新排序列的指示符
    var s = SORT[prefix];
    var table = document.getElementById(tbodyId).parentNode;
    table.querySelectorAll('.sort-ind').forEach(function(el) { el.textContent = ''; });
    var colMap = {'c':1,'p':2,'share':3,'tp':4,'yoy':5};
    var headers = table.querySelectorAll('thead th');
    var activeHeader = headers[colMap[s.col]];
    if (activeHeader) {
        activeHeader.querySelector('.sort-ind').textContent = s.asc ? '▲' : '▼';
    }
    
    // 获取左侧表（t1）的占比作参照
    var refShares = {};
    if (prefix !== 't1') {
        var refResult = getFilteredData('t1');
        for (var i = 0; i < refResult.rows.length; i++) {
            refShares[refResult.rows[i].c] = refResult.rows[i].share;
        }
    }
    
    // 按当前排序列排序
    var s = SORT[prefix];
    rows.sort(function(a,b) {
        var va = a[s.col], vb = b[s.col];
        // null 处理（排最后）
        if (va === null && vb === null) return 0;
        if (va === null) return 1;
        if (vb === null) return -1;
        // 字符串比较
        if (typeof va === 'string') {
            var r = va.localeCompare(vb, 'zh-CN');
            return s.asc ? r : -r;
        }
        // 数值比较
        return s.asc ? (va - vb) : (vb - va);
    });
    var html = '';
    for (var i = 0; i < rows.length; i++) {
        var r = rows[i];
        var cls = '';
        var yoyHtml = '';
        if (r.yoy === null) {
            cls = 'zero'; yoyHtml = '-';
        } else if (r.yoy >= 0) {
            cls = 'up'; yoyHtml = '+' + r.yoy.toFixed(2) + '%';
        } else {
            cls = 'down'; yoyHtml = r.yoy.toFixed(2) + '%';
        }
        var shareHtml = r.share.toFixed(2) + '%';
        if (prefix !== 't1' && refShares[r.c] !== undefined) {
            var diff = r.share - refShares[r.c];
            var arrowCls = 'flat-arrow';
            var arrowSym = '→';
            if (diff > 0.01) { arrowCls = 'up-arrow'; arrowSym = '↑'; }
            else if (diff < -0.01) { arrowCls = 'down-arrow'; arrowSym = '↓'; }
            shareHtml = r.share.toFixed(2) + '%<span class="' + arrowCls + '">' + arrowSym + '</span>';
        }
        var hl = (r.c === '泰山保险') ? ' highlight' : '';
        var sel = (selectedCompany && r.c === selectedCompany) ? ' selected-row' : '';
        html += '<tr class="' + hl + sel + '" data-c="' + r.c + '"><td>' + (i + 1) + '</td><td>' + r.c + '</td><td>' + fmt(r.p) + '</td><td>' + shareHtml + '</td><td>' + fmt(r.tp) + '</td><td class="' + cls + '">' + yoyHtml + '</td></tr>';
    }
    var totYoy = (tTp > 0) ? (tP / tTp - 1) * 100 : null;
    var totCls = '', totYoyHtml = '';
    if (totYoy === null) {
        totCls = 'zero'; totYoyHtml = '-';
    } else if (totYoy >= 0) {
        totCls = 'up'; totYoyHtml = '+' + totYoy.toFixed(2) + '%';
    } else {
        totCls = 'down'; totYoyHtml = totYoy.toFixed(2) + '%';
    }
    html += '<tr class="tot"><td></td><td>合计</td><td>' + fmt(tP) + '</td><td>100.00%</td><td>' + fmt(tTp) + '</td><td class="' + totCls + '">' + totYoyHtml + '</td></tr>';
    document.getElementById(tbodyId).innerHTML = html;
}

function sortTable(prefix, col) {
    var s = SORT[prefix];
    if (s.col === col) {
        s.asc = !s.asc;
    } else {
        s.col = col;
        s.asc = (col === 'c');
    }
    renderTable(prefix);
}

function selectCompany(name) {
    if (selectedCompany === name) {
        selectedCompany = null;
    } else {
        selectedCompany = name;
    }
    renderTable('t1');renderTable('t2');renderTable('t3');
    setTimeout(updateCharts, 50);
    setTimeout(updateUsageCharts, 50);
}

// 初始渲染三个表（联动默认开启，以 t1 为准同步）
if (document.getElementById('lnkToggle').checked) {
    syncFrom('t1');
}
renderTable('t1');
renderTable('t2');
renderTable('t3');
setTimeout(updateCharts, 100);
setTimeout(updateUsageCharts, 150);

// 侧边栏高度与第一个表卡片对齐
function syncSidebarHeight() {
    var card = document.querySelector('.card');
    var sidebar = document.querySelector('.header');
    if (card && sidebar) {
        sidebar.style.minHeight = card.offsetHeight + 'px';
    }
}
// 等待渲染完成后执行
setTimeout(syncSidebarHeight, 50);
// 筛选变化后重新对齐
var origRender = renderTable;
renderTable = function(prefix) {
    origRender(prefix);
    setTimeout(syncSidebarHeight, 50);
    setTimeout(updateCharts, 100);
    setTimeout(updateUsageCharts, 100);
};

// 左表行点击选中公司
document.getElementById('tbody1').addEventListener('click', function(e) {
    var tr = e.target.closest('tr');
    if (!tr || !tr.dataset.c) return;
    if (tr.classList.contains('tot')) return;
    selectCompany(tr.dataset.c);
});
</script>
